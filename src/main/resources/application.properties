spring.application.name=quoraproject

# ---------------------------------------------------------------------------
# Datasource (MySQL by default)
# Values come from environment variables or a .env file in the project root
# (loaded by spring-dotenv). Local defaults are provided so the app starts
# without any extra setup as long as MySQL is running on localhost:3306.
# createDatabaseIfNotExist=true creates QUORA_DB_LOCAL automatically.
#
# No MySQL installed? Run with the "h2" profile instead (in-memory DB):
#   IntelliJ: Run configuration -> Active profiles: h2
#   CLI:      ./gradlew bootRun --args='--spring.profiles.active=h2'
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/QUORA_DB_LOCAL?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# ---------------------------------------------------------------------------
# JPA
# 'update' is acceptable for local development only. Use 'validate' plus a
# migration tool (Flyway/Liquibase) in production.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
# JWT_SECRET must be a Base64-encoded key of at least 256 bits (32 bytes).
# Generate one with: openssl rand -base64 48
# The default below is for LOCAL DEVELOPMENT ONLY - always set JWT_SECRET
# (env var or .env) for anything beyond your own machine.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:hWWapUSxdq/PNiQ0px5+DjR1grz9tRt3qlgniOya55rVelefe5AYsi9ZCv2EcZ9H}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------------
# Error handling / OpenAPI
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${PORT:10000}
server.address=0.0.0.0
