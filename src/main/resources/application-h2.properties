# Optional profile: run the app against an in-memory H2 database (no MySQL needed).
# Activate with --spring.profiles.active=h2 (or "Active profiles: h2" in IntelliJ).
spring.datasource.url=jdbc:h2:mem:quora_local;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Browse the in-memory DB at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
